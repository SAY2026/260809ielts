<title>IELTS 雅思教练 · 学练一体</title>
<style>
:root{
  --bg:#f7f5f0; --card:#ffffff; --ink:#1f2937; --muted:#6b7280;
  --brand:#0f766e; --brand2:#115e59; --accent:#d97706; --accent2:#b45309;
  --blue:#2563eb; --pink:#db2777; --green:#059669; --red:#dc2626;
  --line:#e5e7eb; --soft:#f0fdfa; --amber:#fffbeb;
  --r:14px; --shadow:0 1px 3px rgba(0,0,0,.07),0 4px 14px rgba(0,0,0,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
header{background:linear-gradient(135deg,var(--brand) 0%,var(--brand2) 100%);color:#fff;padding:14px 18px;position:sticky;top:0;z-index:50;box-shadow:var(--shadow)}
.hrow{display:flex;align-items:center;gap:12px;max-width:1100px;margin:0 auto;flex-wrap:wrap}
.logo{font-size:1.15rem;font-weight:700;letter-spacing:.5px;cursor:pointer}
.logo small{font-weight:400;opacity:.85;font-size:.75rem;margin-left:6px}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
nav button{background:rgba(255,255,255,.12);border:none;color:#fff;padding:7px 14px;border-radius:999px;cursor:pointer;font-size:.9rem;transition:.15s}
nav button:hover{background:rgba(255,255,255,.25)}
nav button.on{background:#fff;color:var(--brand2);font-weight:700}
main{max-width:1100px;margin:0 auto;padding:20px 16px 80px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:20px;margin-bottom:16px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.g4{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
h2{font-size:1.25rem;margin-bottom:10px}
h3{font-size:1.05rem;margin-bottom:8px}
.muted{color:var(--muted);font-size:.88rem}
.tag{display:inline-block;background:var(--soft);color:var(--brand2);border:1px solid #99f6e4;padding:1px 10px;border-radius:999px;font-size:.75rem;margin-right:6px}
.tag.amber{background:var(--amber);color:var(--accent2);border-color:#fde68a}
.btn{display:inline-block;background:var(--brand);color:#fff;border:none;padding:9px 18px;border-radius:10px;cursor:pointer;font-size:.95rem;transition:.15s;text-align:center}
.btn:hover{background:var(--brand2)}
.btn.sec{background:#fff;color:var(--brand2);border:1.5px solid var(--brand)}
.btn.sec:hover{background:var(--soft)}
.btn.warn{background:var(--accent)} .btn.warn:hover{background:var(--accent2)}
.btn.ghost{background:transparent;color:var(--muted);border:1.5px solid var(--line)}
.btn.sm{padding:5px 12px;font-size:.85rem;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{justify-content:space-between}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tabs button{background:#fff;border:1.5px solid var(--line);padding:8px 16px;border-radius:10px;cursor:pointer;font-size:.92rem}
.tabs button.on{border-color:var(--brand);background:var(--soft);color:var(--brand2);font-weight:700}
.daycell{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;text-align:center;transition:.15s}
.daycell:hover{border-color:var(--brand);transform:translateY(-2px)}
.daycell .dn{font-weight:800;font-size:1.1rem;color:var(--brand2)}
.daycell .dt{font-size:.78rem;color:var(--muted)}
.daycell .done{font-size:.72rem;color:var(--green);font-weight:700}
.flash{background:#fff;border-radius:18px;box-shadow:var(--shadow);min-height:260px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;cursor:pointer;text-align:center;border:2px solid transparent}
.flash:hover{border-color:#99f6e4}
.flash .w{font-size:2rem;font-weight:800}
.flash .pos{color:var(--accent2);font-size:.9rem;margin:6px 0}
.flash .cn{font-size:1.3rem;color:var(--brand2);font-weight:600}
.flash .hint{color:var(--muted);font-size:.8rem;margin-top:18px}
.opt{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:11px 15px;margin:7px 0;cursor:pointer;font-size:1rem;transition:.12s}
.opt:hover{border-color:var(--brand)}
.opt.right{background:#ecfdf5;border-color:var(--green);font-weight:700}
.opt.wrong{background:#fef2f2;border-color:var(--red)}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--brand);border-radius:99px;transition:width .3s}
input[type=text],textarea,select{font-family:inherit;font-size:1rem;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;background:#fff;color:var(--ink)}
textarea{resize:vertical;line-height:1.7}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--brand)}
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:1.5rem;color:var(--brand2)}
.timer.low{color:var(--red)}
.passage{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);padding:24px;max-height:70vh;overflow-y:auto;font-size:.98rem}
.passage p{margin-bottom:14px}
.qitem{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
.qitem.right{border-color:var(--green);background:#f7fef9}
.qitem.wrong{border-color:var(--red);background:#fffafa}
.qn{font-weight:800;color:var(--brand2);margin-right:6px}
.explain{margin-top:8px;padding:8px 12px;background:var(--amber);border-radius:8px;font-size:.85rem;color:#78350f}
.tf-opts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.tf-opts button{padding:6px 16px;border-radius:8px;border:1.5px solid var(--line);background:#fff;cursor:pointer}
.tf-opts button.sel{background:var(--soft);border-color:var(--brand);font-weight:700;color:var(--brand2)}
.cue{background:linear-gradient(135deg,#fefce8,#fff);border:1.5px solid #fde68a;border-radius:var(--r);padding:20px;white-space:pre-line}
.sample{background:var(--soft);border-left:4px solid var(--brand);border-radius:0 10px 10px 0;padding:16px;font-size:.95rem;margin-top:12px}
.frame-card{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:16px}
.frame-card .f{font-size:1.15rem;font-weight:800;color:var(--brand2)}
.big-stat{font-size:2rem;font-weight:800;color:var(--brand2)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:860px){.split{grid-template-columns:1fr}}
.home-card{cursor:pointer;transition:.15s;border:2px solid transparent;position:relative;overflow:hidden}
.home-card:hover{border-color:var(--brand);transform:translateY(-3px)}
.home-card .icon{font-size:2rem}
.wcount{font-size:.85rem;color:var(--muted);text-align:right;margin-top:4px}
.pill{background:var(--soft);border-radius:10px;padding:10px 14px;font-size:.9rem}
audio{width:100%;margin-top:8px}
.speak-btn{background:none;border:none;cursor:pointer;font-size:1.1rem;vertical-align:middle}
.footer-tip{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:8px 16px;font-size:.78rem;color:var(--muted);text-align:center;z-index:40}
.chartbox{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:12px;overflow-x:auto}
.flowstep{display:flex;align-items:center;gap:8px;margin:6px 0}
.flowstep .num{background:var(--brand);color:#fff;border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;font-size:.85rem}
details{margin-top:10px}
summary{cursor:pointer;color:var(--brand2);font-weight:600}
.chk{display:flex;gap:8px;align-items:flex-start;margin:6px 0;font-size:.92rem}
.chk input{width:auto;margin-top:4px}
.hidden{display:none!important}
.exline{margin-top:12px;font-size:.95rem;font-style:italic;color:#374151;background:var(--amber-bg,#fffbeb);padding:8px 14px;border-radius:10px;max-width:520px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
.modal-box{background:#fff;border-radius:16px;max-width:560px;width:100%;max-height:85vh;overflow-y:auto;padding:22px;box-shadow:0 10px 40px rgba(0,0,0,.2)}
</style>
</head>

const SPEAK_P2 = [
  { title: "Describe a place near water you enjoy visiting", card: "You should say:\n• where it is\n• how often you go there\n• what you do there\nand explain why you enjoy visiting it.",
    sample: "One place I really love is Nungwi beach, on the northern tip of the island where I live. It takes about an hour to get there, so I usually go once a month, often with a couple of friends. What we normally do is arrive in the late afternoon, when the tide is out and the sand stretches for what feels like miles. We walk along the shore, watch the fishermen bring in their wooden dhows, and then find a small café for grilled fish and fresh juice. The thing is, my weekdays are quite intense — I teach and study most of the day — so this beach has become a kind of reset button for me. The sound of the waves genuinely slows my thoughts down. I always end up staying until sunset, because the sky turns this incredible orange-pink colour, and it turns out that's exactly what I need to start the new week feeling refreshed.",
    p3: ["Why do many people like spending time near water?", "Should governments limit construction near beaches?", "How does tourism change coastal towns?"] },
  { title: "Describe a skill that took you a long time to learn", card: "You should say:\n• what the skill is\n• when and how you learned it\n• what difficulties you had\nand explain how you felt when you finally learned it.",
    sample: "I'd like to talk about learning to speak English confidently, which honestly took me years rather than months. I studied grammar at school like everyone else, but real speaking only started when I moved abroad for work and suddenly had to use English every single day — in meetings, in markets, everywhere. The biggest difficulty wasn't vocabulary; it was the fear of making mistakes in front of people. I used to rehearse a sentence three times in my head and then miss my chance to say it. What helped was setting tiny daily habits: a hundred new words a day, one recorded answer every evening, and copying useful sentence frames like 'It depends on...' or 'It turns out...'. When I finally noticed I had argued a point in a meeting without translating in my head first, I felt a mix of relief and real pride. It taught me that big skills are just small habits repeated for a long time.",

  { title: "Describe a person who has influenced you", card: "You should say:\n• who the person is\n• how you know them\n• what they have done\nand explain why they influenced you.",

    p3: ["Should young people make big decisions alone or with their family?", "Why do some people find it hard to make decisions?", "Are decisions based on emotion worse than decisions based on logic?"] },
  { title: "Describe a traditional celebration in your country", card: "You should say:\n• what the celebration is\n• when it takes place\n• what people do\nand explain why it is important.",

  passage: `<p><b>A</b> — For most of the history of psychology, forgetting was treated as a failure — a leak in the mind's storage system to be plugged by better technique. The pioneering nineteenth-century researcher Hermann Ebbinghaus, who spent years memorizing lists of meaningless syllables, gave the field its founding image: the 'forgetting curve', a steep slide showing that we lose more than half of newly learned material within days unless we review it. Generations of students have taken the obvious lesson: repeat, revise, repeat again.</p>
<p><b>B</b> — Ebbinghaus's curve, however, contains a second and more hopeful message that is often overlooked. Each time a memory is successfully retrieved, the curve flattens: the memory decays more slowly than before. This is the basis of 'spaced repetition', a technique in which review sessions are separated by ever-longer intervals — a day, then three days, then a week, then a month. Modern software schedules each item individually, presenting a word at precisely the moment the learner is predicted to be on the verge of forgetting it. Studies of language learners consistently show that spaced schedules outperform massed 'cramming', even when total study time is identical.</p>
<p><b>C</b> — Curiously, the effort of retrieval seems to matter as much as the timing. Psychologists Robert and Elizabeth Bjork have argued for what they call 'desirable difficulties': conditions that make learning feel harder but produce stronger memories. Testing yourself before you feel ready, mixing different topics in one session, and even studying in a different room each time all impair short-term performance while improving long-term retention. The feeling of easy fluency, the Bjorks warn, is a poor guide to real learning — learners routinely judge cramming to be more effective than testing, when the reverse is true.</p>
<p><b>D</b> — More recent work has pushed the rehabilitation of forgetting further, suggesting that it is not a defect at all but a designed feature of the brain. Researchers in neuroscience have identified active mechanisms — dedicated cells and chemical pathways — whose function appears to be to weaken memories. From an evolutionary standpoint this makes sense. An animal that remembered every detail of every day would drown in irrelevance; what serves survival is a memory system that keeps the general lesson and discards the particular clutter. Forgetting, on this view, is the price of generalisation: we lose the individual trees so that we can see the forest.</p>
<p><b>E</b> — The rare individuals who cannot forget illustrate the point. People with 'highly superior autobiographical memory' can recall what they ate, wore and watched on almost any date of their adult lives. Yet studies find they are no better than average at the reasoning and problem-solving tasks that ordinary memory serves, and several describe their condition as exhausting — an endless, uninvited replay. Their experience suggests that total recall is not an enhanced version of normal memory but a different and not obviously preferable arrangement.</p>
<p><b>F</b> — None of this rescues the student who blanks on an exam question. But it does reframe the task of learning. The goal is not to prevent forgetting — an impossible and perhaps undesirable aim — but to manage it: to place reviews where the forgetting curve predicts they will do the most good, to seek the difficulty that signals durable learning, and to accept that a mind which discards well is also a mind that thinks well. The learner's enemy, it turns out, was a collaborator all along.</p>`,

  minutes: 20,
  passage: `<p><b>A</b> — In 1990, the average garment bought in Europe was worn around forty times before being discarded. Today the figure is closer to fourteen, and for some categories of cheap clothing it is in single digits. The change is the work of 'fast fashion': a business model built on translating catwalk designs into shop-floor stock within weeks, at prices low enough to make clothes feel disposable. Where the industry once worked to four seasons a year, some online retailers now introduce thousands of new styles every week.</p>
<p><b>B</b> — The model's commercial logic is undeniable. By compressing design, manufacture and distribution into a continuous cycle, fast-fashion firms respond to demand almost in real time, holding little stock and rarely guessing wrong. Prices fell so far that between 2000 and 2015 global clothing production doubled while the price of garments, adjusted for inflation, actually declined. For consumers on modest incomes, fashion — once a marker of privilege — became broadly accessible for the first time.</p>
<p><b>C</b> — The environmental account, however, is heavily in deficit. The industry is estimated to produce between eight and ten percent of global carbon emissions — more than international aviation and shipping combined. A single cotton shirt requires around 2,700 litres of water to produce, roughly what one person drinks in two and a half years, and textile dyeing is a major polluter of rivers in producing countries. Synthetic fabrics create a subtler problem: each wash of a polyester garment releases microscopic plastic fibres, and these microfibres are now found in deep-sea sediment, Arctic ice and human blood.</p>
<p><b>D</b> — Disposal completes the cycle. Of the roughly 100 billion garments produced annually, the majority end their lives in landfill or incinerators within a few years. Less than one percent of clothing is recycled into new clothing; most 'recycling' means downgrading fabric into insulation or industrial rags — a one-way journey that merely postpones the landfill. Vast quantities of donated clothes are exported to second-hand markets in Africa, where traders complain that the quality of recent arrivals is now so poor that up to forty percent of some bales is unsellable and is dumped or burned locally.</p>

<p><b>B</b> — The sceptics' case was demolished in 1976, when the Polynesian Voyaging Society sailed Hokule'a, a reconstructed voyaging canoe, from Hawai'i to Tahiti — a journey of over 4,000 kilometres — using traditional methods alone. No Hawaiian navigator then living retained the full art, so the society turned to Mau Piailug, a master navigator from the tiny Micronesian island of Satawal, one of the last places where the tradition survived unbroken. Mau guided the canoe to landfall in thirty-three days. The voyage ignited a cultural renaissance across Polynesia; dozens of canoes have since crossed the ocean, and in 2017 Hokule'a completed a circumnavigation of the globe.</p>

<p><b>D</b> — Finding a course is one problem; knowing one's position is another. Western navigation solves it with instruments; the Pacific navigator solves it with sustained attention. Using a system researchers call dead reckoning, the navigator holds in mind a continuous estimate of speed, heading and elapsed time — an unbroken mental calculation that may last a month, during which a master sleeps only in fragments. Mau's students describe the discipline as the hardest part of the art: the sea offers no pause, and a navigator who loses the thread of the reckoning cannot easily recover it.</p>

The clearest benefit is the recovery of time. Commuting consumed two or more hours of many workers' days; returning that time to families, exercise and rest has measurable effects on health and wellbeing. Remote work also widens opportunity geographically: a talented person in a small town or on an island can now hold a job once reserved for residents of expensive capital cities, which spreads income beyond congested urban centres and eases pressure on housing and transport. Parents and people with disabilities, who were often pushed out of office-based employment, find it easier to remain in the workforce.

The disadvantages are nonetheless serious. Remote workers report isolation, and younger employees lose the informal learning that comes from watching experienced colleagues. The boundary between work and rest can dissolve, so that the office follows people into their kitchens and bedrooms. City-centre economies built around office workers — cafés, cleaners, transport systems — have suffered genuine losses.

However, most of these harms respond to sensible management rather than requiring a return to the old model. Hybrid schedules preserve mentoring and social contact; clear rules about working hours protect private life; and urban economies are already adapting, as offices convert into housing that city centres badly need.

In conclusion, working from home redistributes time, income and opportunity in ways that benefit far more people than it harms, and its drawbacks are manageable. Society is better off with this flexibility than without it. (270 words)`},
];

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function speak(text){

    if(v) u.voice = v;
    speechSynthesis.speak(u);
  }catch(e){}

// ---- AI 批改（可选：填入自己的 Anthropic API Key，仅保存在本机浏览器）----
async function aiAsk(system, user){
  const key = S.get('api_key','');
  if(!key) throw new Error('NO_KEY');
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method:'POST',
    headers:{
      'Content-Type':'application/json',
      'x-api-key': key,
      'anthropic-version':'2023-06-01',
      'anthropic-dangerous-direct-browser-access':'true'
    },
    body: JSON.stringify({ model: S.get('api_model','claude-sonnet-4-5'), max_tokens: 1500, system, messages:[{role:'user',content:user}] })
  });
  if(!res.ok) throw new Error('API ' + res.status + (res.status===401?'（Key 无效）':res.status===429?'（请求太频繁）':''));
  const data = await res.json();
  return (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n');
}
function mdLite(t){
  return esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/^### (.+)$/gm,'<b>$1</b>').replace(/^## (.+)$/gm,'<b>$1</b>').replace(/^# (.+)$/gm,'<b>$1</b>').replace(/^- /gm,'• ').replace(/\n/g,'<br>');
}
// outId: 结果容器id；build(): 返回 {system,user}；copyMsg: 无Key时复制的完整提示词
async function aiRun(outId, build){
  const out = document.getElementById(outId);
  if(!out) return;
  const p = build();
  if(!S.get('api_key','')){
    out.innerHTML = `<div class="pill">🔑 还没设置 API Key。两种方式：<br>① 点右上角 <b>⚙ 设置</b> 填入 Anthropic API Key，即可在页面内直接批改；<br>② 点下面按钮复制「内容+批改指令」，粘贴给 Claude 聊天批改。<br><button class="btn sm" style="margin-top:8px" onclick="copyText(this)" data-copy="${esc(p.system + '\n\n' + p.user)}">📋 复制去找 Claude 批改</button></div>`;
    return;
  }
  out.innerHTML = `<div class="pill">🤖 AI 批改中，请稍候…</div>`;
  try{
    const r = await aiAsk(p.system, p.user);
    out.innerHTML = `<div class="sample" style="margin-top:10px">${mdLite(r)}</div>`;
  }catch(e){
    out.innerHTML = `<div class="pill" style="background:#fef2f2;color:#991b1b">批改失败：${esc(e.message)}。内容没丢，可稍后再试，或用「复制」方式找 Claude 批改。<br><button class="btn sm" style="margin-top:8px" onclick="copyText(this)" data-copy="${esc(p.system + '\n\n' + p.user)}">📋 复制去找 Claude 批改</button></div>`;
  }
}
function copyText(btn){
  const t = btn.dataset.copy;
  const done = ()=>{ btn.textContent='✅ 已复制，去粘贴给 Claude'; };
  navigator.clipboard.writeText(t).then(done, ()=>{
    const ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); done(); }catch(e){ alert('复制失败，请手动复制'); }
    document.body.removeChild(ta);
  });
}

function exportData(){

  a.href = URL.createObjectURL(blob);

function importData(input){
  const f = input.files && input.files[0];
  if(!f) return;
  const r = new FileReader();
  r.onload = ()=>{
    try{
      const j = JSON.parse(r.result);
      const data = j.data || j;
      let n = 0;
      Object.keys(data).forEach(k=>{
        if(!k.startsWith('ielts_')) return;
        try{ localStorage.setItem(k, data[k]); }catch(e){}
        try{ MEM[k.slice(6)] = JSON.parse(data[k]); }catch(e){}
        n++;
      });
      alert('✅ 已导入 ' + n + ' 项数据');
      document.getElementById('modal').classList.add('hidden');
      go(VIEW);

}

function recUI(id){
  return `<div class="row" style="margin-top:10px">
    <button class="btn warn sm" id="recbtn-${id}" onclick="toggleRec('${id}')">🎙️ 开始录音</button>

  </div><div id="recout-${id}"></div>`;
}
async function toggleRec(id){
  const btn = document.getElementById('recbtn-'+id);
  const st = document.getElementById('recst-'+id);
  if(REC.mr && REC.mr.state === 'recording'){
    REC.mr.stop(); return;
  }
  const issue = micEnvIssue();
  if(issue){ if(st) st.innerHTML = '⚠️ ' + issue; return; }
  try{
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    REC.chunks = []; REC.active = id;
    REC.mr = new MediaRecorder(stream);
    REC.mr.ondataavailable = e=>REC.chunks.push(e.data);
    REC.mr.onstop = ()=>{
      stream.getTracks().forEach(t=>t.stop());
      const blob = new Blob(REC.chunks, {type: REC.mr.mimeType || 'audio/webm'});
      const url = URL.createObjectURL(blob);
      const out = document.getElementById('recout-'+REC.active);
      if(out) out.innerHTML = `<audio controls src="${url}"></audio><div class="muted" style="font-size:.8rem">听自己的录音：注意 1）有没有停顿超过3秒 2）时态对不对 3）能不能换个更好的词</div>`;
      const b = document.getElementById('recbtn-'+REC.active);
      if(b){ b.textContent = '🎙️ 重新录音'; b.classList.remove('sec'); }
      const s2 = document.getElementById('recst-'+REC.active);
      if(s2) s2.textContent = '✅ 已录制，点播放回听';
    };
    REC.mr.start();
    btn.textContent = '⏹️ 停止录音';
    if(st) st.textContent = '● 录音中…说满30秒以上';
  }catch(e){
    const issue = micEnvIssue();
    if(st) st.innerHTML = '⚠️ ' + (issue || (e && e.name==='NotAllowedError'
      ? '麦克风权限被拒绝：点地址栏 🔒/ⓘ → 网站设置 → 麦克风 → 允许，刷新后重试。'
      : '录音失败（' + esc(e && e.name || '未知') + '）。点口语页顶部「测试麦克风」查看原因。'));
  }
}

// ---- 计时器 ----
let TIMERS = {};
function startTimer(id, secs, onEnd){
  stopTimer(id);
  TIMERS[id] = { left: secs, iv: setInterval(()=>{
    TIMERS[id].left--;
    const el = document.getElementById('timer-'+id);
    if(el){
      el.textContent = fmtT(TIMERS[id].left);
      el.classList.toggle('low', TIMERS[id].left <= 60);
    }
    if(TIMERS[id].left <= 0){ stopTimer(id); if(onEnd) onEnd(); }
  }, 1000)};
  const el = document.getElementById('timer-'+id);
  if(el) el.textContent = fmtT(secs);
}
function stopTimer(id){ if(TIMERS[id]){ clearInterval(TIMERS[id].iv); delete TIMERS[id]; } }
function stopAllTimers(){ Object.keys(TIMERS).forEach(stopTimer); }
function fmtT(s){ if(s<0)s=0; return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }

      <div class="row" style="justify-content:center;margin-top:12px">
        <button class="btn" onclick="startQuiz(${day})">→ 马上测验巩固</button>
        <button class="btn sec" onclick="startFlash(${day})">再刷一轮</button>
        <button class="btn ghost" onclick="openWrongbook()">看错词本</button>
      </div></div>`;
    return;
  }
  const w = WORDS[day][f.list[f.i]];
  zone.innerHTML = `
  <div class="bar"><i style="width:${Math.round(f.i/f.list.length*100)}%"></i></div>
  <div class="muted" style="text-align:right">${f.i+1} / ${f.list.length}</div>
  <div class="flash" onclick="flipFlash()">
    ${ f.flipped
      ? `<div class="w" style="font-size:1.4rem">${esc(w.w)}</div><div class="pos">${esc(w.pos)}</div><div class="cn">${esc(w.cn)}</div>${ EX[w.w] ? `<div class="exline">📖 ${esc(EX[w.w])} <button class="speak-btn" onclick="event.stopPropagation();speak(EX[WORDS[${day}][${f.list[f.i]}].w])">🔊</button></div>` : '' }<div class="hint">👇 诚实作答：认识还是不认识？</div>`
      : `<div class="w">${esc(w.w)} <button class="speak-btn" onclick="event.stopPropagation();speak(WORDS[${day}][${f.list[f.i]}].w)">🔊</button></div><div class="pos">${esc(w.pos)}</div><div class="hint">想出中文意思后，点卡片翻面</div>` }
  </div>
  <div class="row" style="justify-content:center;margin-top:14px">
    <button class="btn sec" style="border-color:var(--red);color:var(--red)" onclick="flashAnswer(false)">❌ 不认识</button>
    <button class="btn" style="background:var(--green)" onclick="flashAnswer(true)">✅ 认识</button>
  </div>`;
  if(!f.flipped) speak(w.w);
}
function flipFlash(){ V.fc.flipped = !V.fc.flipped; drawFlash(); }
function flashAnswer(known){
  const f = V.fc;
  if(known){ f.known++; removeWrong(f.day, f.list[f.i]); }
  else addWrong(f.day, f.list[f.i]);
  f.i++; f.flipped = false; drawFlash();
}
function addWrong(day, idx){
  const wb = S.get('wrongbook', []); const key = day+':'+idx;
  if(!wb.includes(key)){ wb.push(key); S.set('wrongbook', wb); }
}
function removeWrong(day, idx){
  let wb = S.get('wrongbook', []); const key = day+':'+idx;
  if(wb.includes(key)){ S.set('wrongbook', wb.filter(k=>k!==key)); }
}

// --- 测验 ---
function startQuiz(day, fromWrong){
  let pool;
  if(fromWrong){
    pool = S.get('wrongbook', []).map(k=>{ const [d,i]=k.split(':').map(Number); return {day:d, idx:i}; });
    if(pool.length < 4){ alert('错词不足 4 个，先去闪卡里攒一点吧！'); return; }
    pool = shuffle(pool).slice(0, 20);
  } else {
    pool = shuffle(WORDS[day].map((w,i)=>({day, idx:i}))).slice(0, 20);
  }
  V.qz = { day, pool, i:0, score:0, fromWrong: !!fromWrong };
  drawQuiz();
}
function drawQuiz(){
  const q = V.qz;
  const zone = document.getElementById('vzone');
  if(!zone) return;
  if(q.i >= q.pool.length){
    zone.innerHTML = `<div class="card" style="text-align:center">
      <div class="big-stat">${q.score} / ${q.pool.length}</div>
      <p class="muted">${q.score===q.pool.length?'满分！这批词稳了 💪':q.score>=q.pool.length*0.8?'不错！错的几个已记入错词本':'别灰心，错词本里等你复仇'}</p>
      <div class="row" style="justify-content:center;margin-top:12px">
        <button class="btn" onclick="startQuiz(${q.day},${q.fromWrong})">再来一轮</button>
        <button class="btn sec" onclick="startSpell(${q.day})">→ 听音拼写</button>
        <button class="btn ghost" onclick="rVocab()">返回</button>
      </div></div>`;
    return;
  }
  const cur = q.pool[q.i];
  const word = WORDS[cur.day][cur.idx];
  const en2cn = Math.random() < 0.5;
  // 干扰项取同天词
  const others = shuffle(WORDS[cur.day].map((w,i)=>i).filter(i=>i!==cur.idx)).slice(0,3);
  const optIdx = shuffle([cur.idx, ...others]);
  q.cur = { cur, en2cn, optIdx, answered:false };
  zone.innerHTML = `
  <div class="bar"><i style="width:${Math.round(q.i/q.pool.length*100)}%"></i></div>
  <div class="row spread"><span class="muted">第 ${q.i+1} / ${q.pool.length} 题</span><span class="muted">得分 ${q.score}</span></div>
  <div class="card">
    <h3 style="font-size:1.4rem">${ en2cn ? esc(word.w)+` <button class="speak-btn" onclick="speak('${word.w.replace(/'/g,"\\'")}')">🔊</button>` : esc(word.cn) } <span class="tag">${esc(word.pos)}</span></h3>
    <p class="muted">${en2cn?'选出正确的中文意思':'选出对应的英文单词'}</p>
    <div id="qopts">${ optIdx.map((oi,n)=>`<button class="opt" id="opt-${n}" onclick="answerQuiz(${n})">${ en2cn ? esc(WORDS[cur.day][oi].cn) : esc(WORDS[cur.day][oi].w) }</button>`).join('') }</div>
  </div>`;
  if(en2cn) speak(word.w);
}
function answerQuiz(n){
  const q = V.qz; if(q.cur.answered) return;
  q.cur.answered = true;
  const { cur, optIdx } = q.cur;
  const rightN = optIdx.indexOf(cur.idx);
  const rightEl = document.getElementById('opt-'+rightN);
  if(rightEl) rightEl.classList.add('right');
  if(n === rightN){
    q.score++;
    if(q.fromWrong) removeWrong(cur.day, cur.idx);
  } else {
    const el = document.getElementById('opt-'+n);
    if(el) el.classList.add('wrong');
    addWrong(cur.day, cur.idx);
  }
  setTimeout(()=>{ q.i++; drawQuiz(); }, n===rightN ? 650 : 1400);
}

// --- 拼写 ---
function startSpell(day){
  V.sp = { day, list: shuffle(WORDS[day].map((w,i)=>i)).slice(0,10), i:0, score:0 };
  drawSpell();
}
function drawSpell(){
  const s = V.sp; const zone = document.getElementById('vzone');
  if(!zone) return;
  if(s.i >= s.list.length){
    zone.innerHTML = `<div class="card" style="text-align:center">
      <div class="big-stat">${s.score} / ${s.list.length}</div>
      <p class="muted">拼写是 DET 时代你的老对手——每天 10 个，考前就是肌肉记忆。</p>
      <div class="row" style="justify-content:center;margin-top:12px">
        <button class="btn" onclick="startSpell(${s.day})">再来 10 个</button>
        <button class="btn ghost" onclick="rVocab()">返回</button>
      </div></div>`;
    return;
  }
  const w = WORDS[s.day][s.list[s.i]];
  zone.innerHTML = `
  <div class="bar"><i style="width:${Math.round(s.i/s.list.length*100)}%"></i></div>
  <div class="card">
    <div class="row spread"><span class="muted">第 ${s.i+1} / ${s.list.length} 个</span>
    <button class="btn sec sm" onclick="speak(WORDS[${s.day}][${s.list[s.i]}].w)">🔊 再听一遍</button></div>
    <h3 style="margin-top:8px">${esc(w.cn)} <span class="tag">${esc(w.pos)}</span></h3>
    <p class="muted">听发音 + 看中文，拼出英文（回车提交）：</p>
    <input type="text" id="spellin" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="type the word…" onkeydown="if(event.key==='Enter')checkSpell()">
    <div class="row" style="margin-top:10px">
      <button class="btn" onclick="checkSpell()">检查</button>
      <button class="btn ghost sm" onclick="revealSpell()">不会，看答案</button>
    </div>
    <div id="spellout" style="margin-top:10px"></div>
  </div>`;
  speak(w.w);
  const inp = document.getElementById('spellin'); if(inp) inp.focus();
}
function norm(x){ return x.toLowerCase().replace(/[^a-z]/g,''); }
function checkSpell(){
  const s = V.sp; const w = WORDS[s.day][s.list[s.i]];
  const val = document.getElementById('spellin').value.trim();
  const out = document.getElementById('spellout');
  if(!val) return;
  if(norm(val) === norm(w.w)){
    s.score++; removeWrong(s.day, s.list[s.i]);
    out.innerHTML = `<div class="pill" style="background:#ecfdf5;color:#065f46">✅ 正确！<b>${esc(w.w)}</b>${ EX[w.w] ? `<br><span style="font-style:italic">📖 ${esc(EX[w.w])}</span>` : '' }</div>`;
    setTimeout(()=>{ s.i++; drawSpell(); }, 1400);
  } else {
    addWrong(s.day, s.list[s.i]);
    out.innerHTML = `<div class="pill" style="background:#fef2f2;color:#991b1b">❌ 正确拼写：<b>${esc(w.w)}</b>（你写的：${esc(val)}）</div><button class="btn sm" style="margin-top:8px" onclick="V.sp.i++;drawSpell()">下一个 →</button>`;
  }
}
function revealSpell(){
  const s = V.sp; const w = WORDS[s.day][s.list[s.i]];
  addWrong(s.day, s.list[s.i]);
  document.getElementById('spellout').innerHTML = `<div class="pill">📖 <b>${esc(w.w)}</b> — 抄写一遍再走：<input type="text" style="margin-top:6px" onkeydown="if(event.key==='Enter'&&norm(this.value)===norm('${w.w.replace(/'/g,"\\'")}')){V.sp.i++;drawSpell()}" placeholder="照着拼一遍，回车继续"></div>`;
}

// ============ 阅读 ============
function rRead(){
  const r = V.rSel ?? -1;
  if(r < 0){
    app.innerHTML = `<h2>📖 阅读实战</h2>
    <p class="muted" style="margin:8px 0 14px">真实考试节奏：每篇 20 分钟。先看题再读文，边读边定位。交卷自动判分＋逐题解析。</p>
    <div class="grid g3">${READING.map((p,i)=>{
      const best = S.get('read_best_'+p.id, null);
      return `<div class="card home-card" onclick="openRead(${i})"><h3 style="font-size:1rem">${esc(p.title)}</h3>
      <div style="margin-top:6px"><span class="tag">${esc(p.level)}</span><span class="tag amber">${p.questions.length} 题 · ${p.minutes} 分钟</span></div>
      ${best!==null?`<p class="muted" style="margin-top:8px">最好成绩：${best}/${p.questions.length}</p>`:''}</div>`; }).join('')}</div>`;
    return;
  }
  const p = READING[r];
  V.rAns = V.rAns || {};
  app.innerHTML = `
  <div class="row spread">
    <button class="btn ghost sm" onclick="V.rSel=-1;V.rAns={};rRead()">← 文章列表</button>
    <div class="row"><span class="muted">⏱ 剩余</span><span class="timer" id="timer-read">${p.minutes}:00</span>
    <button class="btn sec sm" onclick="startTimer('read',${p.minutes*60},()=>alert('时间到！现在就交卷，看看真实水平。'))">开始计时</button></div>
  </div>
  <h2 style="margin:10px 0">${esc(p.title)}</h2>
  <div class="split">
    <div class="passage">${p.passage}</div>
    <div style="max-height:70vh;overflow-y:auto" id="qcol">${p.questions.map((q,i)=>readQHtml(q,i)).join('')}
      <button class="btn" style="width:100%;margin-top:6px" onclick="gradeRead()">📝 交卷判分</button>
    </div>
  </div>
  <div id="rresult"></div>`;
}
function openRead(i){ V.rSel = i; V.rAns = {}; rRead(); }
function readQHtml(q, i){
  const typeName = {tfng:'TRUE / FALSE / NOT GIVEN', mc:'单选', gap:'填空', match:'段落匹配 A–G'}[q.type];
  let body = '';
  if(q.type==='tfng'){
    body = `<div class="tf-opts">${['T','F','NG'].map(o=>`<button id="q${i}-${o}" onclick="setAns(${i},'${o}')">${o==='T'?'TRUE':o==='F'?'FALSE':'NOT GIVEN'}</button>`).join('')}</div>`;
  } else if(q.type==='mc'){
    body = q.options.map((o,n)=>`<button class="opt" id="q${i}-${n}" onclick="setAns(${i},${n})" style="margin:5px 0;padding:8px 12px;font-size:.92rem">${String.fromCharCode(65+n)}. ${esc(o)}</button>`).join('');
  } else if(q.type==='gap'){
    body = `<input type="text" placeholder="填一个单词" style="margin-top:8px" oninput="V.rAns[${i}]=this.value">`;
  } else if(q.type==='match'){
    body = `<div class="tf-opts">${['A','B','C','D','E','F','G'].map(L=>`<button id="q${i}-${L}" onclick="setAns(${i},'${L}')">${L}</button>`).join('')}</div>`;
  }
  return `<div class="qitem" id="qbox-${i}"><span class="qn">${i+1}</span><span class="tag" style="font-size:.68rem">${typeName}</span><br>${esc(q.q)}${body}<div class="explain hidden" id="qex-${i}"></div></div>`;
}
function setAns(i, val){
  V.rAns[i] = val;
  const box = document.getElementById('qbox-'+i);
  if(!box) return;
  box.querySelectorAll('.tf-opts button, .opt').forEach(b=>b.classList.remove('sel','right'));
  const el = document.getElementById('q'+i+'-'+val);
  if(el) el.classList.add('sel');
}
function gradeRead(){
  const p = READING[V.rSel];
  let score = 0;
  p.questions.forEach((q,i)=>{
    const a = V.rAns[i];
    let ok = false;
    if(q.type==='gap') ok = a && q.answer.some(x=>norm(a)===norm(x));
    else if(q.type==='mc') ok = a === q.answer;
    else ok = a === q.answer;
    const box = document.getElementById('qbox-'+i);
    const ex = document.getElementById('qex-'+i);
    if(box){ box.classList.remove('right','wrong'); box.classList.add(ok?'right':'wrong'); }
    if(ex){ ex.classList.remove('hidden');
      const ansTxt = q.type==='mc' ? String.fromCharCode(65+q.answer) : (q.type==='gap'? q.answer[0] : (q.answer==='T'?'TRUE':q.answer==='F'?'FALSE':q.answer==='NG'?'NOT GIVEN':q.answer));
      ex.innerHTML = `${ok?'✅':'❌ 正确答案：<b>'+esc(ansTxt)+'</b><br>'}${esc(q.explain)}`; }
    if(ok) score++;
  });
  stopTimer('read');
  const best = S.get('read_best_'+p.id, 0);
  if(score > best) S.set('read_best_'+p.id, score);
  const scaled = Math.round(score / p.questions.length * 40);
  let band = 2.5; for(const [min,b] of BAND_TABLE){ if(scaled >= min){ band = b; break; } }
  document.getElementById('rresult').innerHTML = `<div class="card" style="text-align:center;margin-top:14px">
    <div class="big-stat">${score} / ${p.questions.length}</div>
    <p>按整卷 40 题折算 ≈ <b>${scaled}/40</b> → 估算 <b style="color:var(--accent2)">Band ${band}</b></p>
    <p class="muted">错题解析已显示在每题下方。把不认识的词加进错词本的方式：去词库里搜同主题的 Day。</p>
  </div>`;
  document.getElementById('rresult').scrollIntoView({behavior:'smooth'});
}

function svgLine(c){
  const W=560,H=300,px=52,py=30,pw=W-px-20,ph=H-py-50;
  const ymax=100;
  const x=i=>px+pw*i/(c.years.length-1), y=v=>py+ph*(1-v/ymax);
  let g='';
  for(let v=0;v<=100;v+=20) g+=`<line x1="${px}" y1="${y(v)}" x2="${px+pw}" y2="${y(v)}" stroke="#eee"/><text x="${px-8}" y="${y(v)+4}" font-size="11" text-anchor="end" fill="#888">${v}%</text>`;
  c.years.forEach((yr,i)=>g+=`<text x="${x(i)}" y="${H-28}" font-size="11" text-anchor="middle" fill="#888">${yr}</text>`);
  c.series.forEach(s=>{
    g+=`<polyline fill="none" stroke="${s.color}" stroke-width="2.5" points="${s.data.map((v,i)=>x(i)+','+y(v)).join(' ')}"/>`;
    s.data.forEach((v,i)=>g+=`<circle cx="${x(i)}" cy="${y(v)}" r="3.5" fill="${s.color}"/>`);
  });
  const leg = c.series.map((s,i)=>`<rect x="${px+ i*150}" y="${H-16}" width="12" height="12" fill="${s.color}"/><text x="${px+16+i*150}" y="${H-6}" font-size="12" fill="#444">${s.name}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:600px">${g}${leg}</svg>`;
}
function svgBar(c){
  const W=560,H=300,px=52,py=30,pw=W-px-20,ph=H-py-50, ymax=100;
  const y=v=>py+ph*(1-v/ymax);
  let g='';
  for(let v=0;v<=100;v+=20) g+=`<line x1="${px}" y1="${y(v)}" x2="${px+pw}" y2="${y(v)}" stroke="#eee"/><text x="${px-8}" y="${y(v)+4}" font-size="11" text-anchor="end" fill="#888">${v}%</text>`;
  const gw = pw/c.cats.length;
  c.cats.forEach((cat,i)=>{
    g+=`<text x="${px+gw*i+gw/2}" y="${H-28}" font-size="11" text-anchor="middle" fill="#888">${cat}</text>`;
    c.series.forEach((s,si)=>{
      const bw = Math.min(34, gw/3);
      const bx = px+gw*i+gw/2 + (si===0? -bw-3 : 3);
      g+=`<rect x="${bx}" y="${y(s.data[i])}" width="${bw}" height="${py+ph-y(s.data[i])}" fill="${s.color}" rx="3"/><text x="${bx+bw/2}" y="${y(s.data[i])-4}" font-size="10" text-anchor="middle" fill="#555">${s.data[i]}</text>`;
    });
  });
  const leg = c.series.map((s,i)=>`<rect x="${px+i*150}" y="${H-16}" width="12" height="12" fill="${s.color}"/><text x="${px+16+i*150}" y="${H-6}" font-size="12" fill="#444">${s.name}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:600px">${g}${leg}</svg>`;
}
function chartHtml(c){
  if(c.type==='line') return `<div class="chartbox">${svgLine(c)}</div>`;
  if(c.type==='bar') return `<div class="chartbox">${svgBar(c)}</div>`;
  return `<div class="chartbox">${c.steps.map((s,i)=>`<div class="flowstep"><span class="num">${i+1}</span><span>${esc(s)}</span></div>`).join('')}</div>`;
}
function editorHtml(key, mins, minWords){
  const draft = S.get('draft_'+key, '');
  return `<div class="card">
    <div class="row spread">
      <h3>你的答卷</h3>
      <div class="row"><span class="timer" id="timer-w">${mins}:00</span>
      <button class="btn sec sm" onclick="startTimer('w',${mins*60},()=>alert('时间到！停笔，数一数字数。'))">⏱ 开始 ${mins} 分钟</button></div>
    </div>
    <textarea id="weditor" rows="14" placeholder="直接在这里写。写完先自查，再对照范文。" oninput="wCount('${key}',${minWords})">${esc(draft)}</textarea>
    <div class="wcount" id="wcnt">0 词 / 至少 ${minWords} 词 · 草稿自动保存</div>
    <div class="row" style="margin-top:8px">
      <button class="btn sm" onclick="aiRun('essay-out',()=>essayPrompt('${key}'))">🤖 AI 批改（页面内直接出分）</button>
      <button class="btn sec sm" onclick="copyForFeedback('${key}')">📋 复制去找 Claude 批改</button>
      <button class="btn ghost sm" onclick="if(confirm('清空这篇草稿？')){S.set('draft_${key}','');rWrite()}">清空</button>
    </div>
    <div id="essay-out"></div>
  </div>`;
}
function wCount(key, minWords){
  const t = document.getElementById('weditor').value;
  S.set('draft_'+key, t);
  const n = (t.trim().match(/[A-Za-z''-]+/g)||[]).length;
  const el = document.getElementById('wcnt');
  el.textContent = `${n} 词 / 至少 ${minWords} 词 · 已自动保存`;
  el.style.color = n>=minWords ? 'var(--green)' : 'var(--muted)';
}
function copyForFeedback(key){
  const t = S.get('draft_'+key, '');
  if(!t.trim()){ alert('先写点内容再复制～'); return; }
  const promptTxt = V.curPrompt || '';
  const msg = `请按 IELTS 写作四项评分标准（TR/CC/LR/GRA）给下面这篇作文打分（各项+总分），指出3个最严重的问题并给出改写示范，最后列出5个可以升级的词汇/句型。\n\n题目：${promptTxt}\n\n我的作文：\n${t}`;
  navigator.clipboard.writeText(msg).then(()=>alert('已复制！粘贴给 Claude 即可获得批改。'), ()=>{
    const ta=document.createElement('textarea'); ta.value=msg; document.body.appendChild(ta); ta.select();
    try{document.execCommand('copy');alert('已复制！');}catch(e){alert('复制失败，请手动全选复制。');}
    document.body.removeChild(ta);
  });
}
function essayPrompt(key){
  const text = (document.getElementById('weditor') ? document.getElementById('weditor').value : S.get('draft_'+key,'')).trim();
  return {
    system: '你是资深雅思写作考官。按官方四项标准（TR任务回应/CC连贯衔接/LR词汇/GRA语法）给这篇作文打分：先给四项分和总分（0.5一档），再指出3个最严重的问题（各附原句+改写示范），最后列5个可升级的词汇或句型。用中文点评，示范用英文。控制在500字内。',
    user: '题目：' + (V.curPrompt||'') + '\n\n作文：\n' + (text || '(空)')
  };
}
